[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multiple-tools"
version = "0.1.0"
description = "Extensible asynchronous tool execution platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]==5.5.3",
    "fastapi==0.116.1",
    "pdf2docx==0.5.13",
    "psycopg[binary]==3.2.9",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35,<2"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "plugins*"]
exclude = ["frontend*"]
