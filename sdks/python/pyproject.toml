[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multipletools"
version = "0.1.1"
description = "Official Python SDK for the Multiple Tools API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Abhishek Kumbhar" }
]

dependencies = [
    "httpx>=0.27,<1"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/Abhiiishek44/multipletools"
Repository = "https://github.com/Abhiiishek44/multipletools"
Issues = "https://github.com/Abhiiishek44/multipletools/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["multipletools*"]

[tool.setuptools.package-data]
multipletools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["multipletools"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
